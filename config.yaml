# ======================================================================
# 量化学习平台 MVP —— 集中配置（单一事实来源 / single source of truth）
#
# 设计原则（对应验收维度 7「可复现复用」）：
#   标的池、回测区间、成本参数、风控阈值全部在此一处定义，
#   代码内不散落硬编码。相同参数重复运行 -> 结果完全一致（确定性引擎）。
# ======================================================================

# ------------------------- 数据层配置 -------------------------
data:
  # 数据源优先级：Sina 为主（稳定、不易被限流），东方财富(EM)为回退/补充。
  # 说明见 docs/operation_guide.md「数据源配置」。
  source_priority: [sina, em]
  cache_dir: data/cache          # 相对项目根目录；缓存为 CSV，便于人工复核
  cache_format: csv
  adjust: qfq                    # 前复权（qfq）。回测全程使用复权价，禁止用不复权/后复权直接算收益
  # 东方财富限流后的退避冷却（秒）。命中限流时等待后再试，绝不重试轰炸。
  em_rate_limit_cooldown_sec: 60
  em_max_retries: 3

# ------------------------- 标的池配置 -------------------------
# 默认交易池为「示意性」选取，非「无幸存者偏差」的历史全集。
# 已知限制：当前成分股回测历史存在幸存者偏差，已在 docs 中明确标注。
universe:
  default_symbols:
    - { symbol: "600519", name: "贵州茅台", asset_type: stock }
    - { symbol: "601318", name: "中国平安", asset_type: stock }
    - { symbol: "600036", name: "招商银行", asset_type: stock }
  # 基准：沪深300 价格指数（买卖持有，无成本；不计入分红再投资——保守口径）
  benchmark:
    symbol: "000300"
    name: "沪深300"
    asset_type: index
  # ETF 示例（演示 ETF 数据接入；qfq 走东方财富，失败回退新浪并标注「待人工复核」）
  etf_example:
    symbol: "510300"
    name: "沪深300ETF"
    asset_type: etf

# ------------------------- 回测引擎配置 -------------------------
backtest:
  initial_capital: 1000000.0     # 初始资金（元）。净值归一化基准 = 初始资金
  default_start: "2021-01-01"    # 默认回测起点（可改）
  default_end: "2023-12-31"      # 默认回测终点（可改）
  base_currency: CNY
  # 是否强制整手（100股）交易。为降低复杂度默认关闭（允许小数股），
  # 已在 docs 标注为简化项；不影响成本与约束的诚实性。
  enforce_lot: false
  lot_size: 100

# ------------------------- 交易成本与市场监管 -------------------------
costs:
  commission_rate: 0.0003        # 佣金费率：万3
  min_commission: 5.0            # 单笔最低佣金（元）
  stamp_tax_rate: 0.0005         # 印花税：卖出方万5（买入不收）
  slippage_rate: 0.001           # 滑点：千1（保守估计，双边计入）
  # 涨跌停阈值（按板块）。复权空间内计算，与未复权比值一致。
  limit_pct:
    main: 0.10                   # 主板 ±10%
    star_chinext: 0.20           # 科创板(688/689)/创业板(300) ±20%
    st: 0.05                     # ST 股 ±5%（简化：未做 ST 名称识别，默认不触发）
  # 代码前缀 -> 板块（仅对股票生效；指数/ETF 不施加涨跌停不可成交约束，已注明）
  limit_rules:
    "688": star_chinext
    "689": star_chinext
    "300": star_chinext
    "002": main
    "001": main
    "000": main
    "003": main
    "004": main
    "600": main
    "601": main
    "603": main
    "605": main

# ------------------------- 指标与异常检测 -------------------------
metrics:
  risk_free_rate: 0.02           # 无风险利率 2%（取正，拉低夏普，保守口径）
  trading_days_per_year: 252     # A股年交易日约252
  # 单日组合收益绝对值超此阈值 -> 标记为「异常收益，疑似复权/对齐错误，待人工复核」
  abnormal_return_threshold: 0.20

# ------------------------- 策略模板注册 -------------------------
strategies:
  templates: [buy_hold, sma_dual, monthly_rebalance]
  # 进阶：代码编辑入口（用户自定义 Python 策略）开关
  allow_code_mode: true
